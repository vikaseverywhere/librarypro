<ion-page>
  <ion-header>
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-back-button defaultHref="/students"></ion-back-button>
      </ion-buttons>
      <ion-title>Add Student</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content>
    <div class="form-container">
      <h2>Register New Student</h2>
      <p>Fill in the details to add a new student</p>

      <ion-item>
        <ion-label position="floating">Full Name</ion-label>
        <ion-input 
          type="text" 
          [(ngModel)]="formData.name"
          name="name"
          placeholder="Enter student's full name">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Email Address</ion-label>
        <ion-input 
          type="email" 
          [(ngModel)]="formData.email"
          name="email"
          placeholder="Enter email address">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Phone Number</ion-label>
        <ion-input 
          type="tel" 
          [(ngModel)]="formData.phone"
          name="phone"
          placeholder="Enter phone number">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Seat Number</ion-label>
        <ion-input
          type="number"
          [(ngModel)]="formData.seatNumber"
          name="seatNumber"
          min="1"
          placeholder="Assign seat number"
        ></ion-input>
      </ion-item>

      <ion-text color="danger" *ngIf="errorMessage">
        <p style="margin-top: 0.5rem;">{{ errorMessage }}</p>
      </ion-text>

      <div class="form-buttons">
        <ion-button expand="block" (click)="onSave()" [disabled]="!isFormValid() || isSaving">
          <ion-spinner *ngIf="isSaving" name="crescent" slot="start"></ion-spinner>
          <ion-icon *ngIf="!isSaving" name="add-circle-outline" slot="start"></ion-icon>
          {{ isSaving ? 'Saving...' : (isEditMode ? 'Update Student' : 'Add Student') }}
        </ion-button>
        <ion-button expand="block" fill="outline" routerLink="/students">
          Cancel
        </ion-button>
      </div>
    </div>
  </ion-content>
</ion-page>
