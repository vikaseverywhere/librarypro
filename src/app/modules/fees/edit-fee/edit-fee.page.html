<ion-header>
  <ion-toolbar>
    <ion-title>Edit Fee</ion-title>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/fees"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div style="padding: 16px; max-width: 400px; margin: 0 auto;">
    <ion-card *ngIf="fee">
      <ion-card-header>
        <ion-card-title>Edit Fee</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-item>
          <ion-label position="stacked">Amount</ion-label>
          <ion-input type="number" [(ngModel)]="amount" min="1"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="stacked">Due Date</ion-label>
          <ion-input type="date" [(ngModel)]="dueDate"></ion-input>
        </ion-item>
        <ion-button expand="block" color="primary" (click)="onSave()" [disabled]="isSaving">
          <ion-icon name="save-outline" slot="start"></ion-icon>
          Save
        </ion-button>
      </ion-card-content>
    </ion-card>
    <div *ngIf="isLoading" style="text-align:center; margin-top:30px;">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Loading fee...</p>
    </div>
  </div>
</ion-content>
