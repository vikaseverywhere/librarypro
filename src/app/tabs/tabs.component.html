<ion-tabs>
  <ion-tab-bar slot="bottom">

    <ion-tab-button tab="dashboard" layout="icon-top">
      <ion-icon name="home-outline" class="tab-icon-off"></ion-icon>
      <ion-icon name="home" class="tab-icon-on"></ion-icon>
      <ion-label>Home</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="students" layout="icon-top">
      <ion-icon name="people-outline" class="tab-icon-off"></ion-icon>
      <ion-icon name="people" class="tab-icon-on"></ion-icon>
      <ion-label>Students</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="transactions" layout="icon-top">
      <ion-icon name="card-outline" class="tab-icon-off"></ion-icon>
      <ion-icon name="card" class="tab-icon-on"></ion-icon>
      <ion-label>Payments</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="settings" layout="icon-top">
      <ion-icon name="grid-outline" class="tab-icon-off"></ion-icon>
      <ion-icon name="grid" class="tab-icon-on"></ion-icon>
      <ion-label>More</ion-label>
    </ion-tab-button>

  </ion-tab-bar>
</ion-tabs>
